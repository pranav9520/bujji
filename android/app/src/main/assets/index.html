<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>Bujji</title><link rel="stylesheet" href="app.css"><script src="app.js" defer></script></head>
