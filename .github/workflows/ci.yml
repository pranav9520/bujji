name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    name: Python and public-tree audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.lock -e '.[test]'
      - run: python scripts/check_public_tree.py
      - run: python -m pytest tests -q
  frontend:
    name: Frontend and desktop policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend run test:voice
      - run: npm --prefix desktop ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm --prefix desktop test
  android:
    name: Android build and tests (JDK 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          SDK_MANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDK_MANAGER" || { echo 'Android command-line tools missing from runner SDK.'; exit 1; }
          "$SDK_MANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --console=plain
        working-directory: android
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
  browser:
    name: Browser flows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.lock -e '.[test,browser-test]'
      - run: python -m playwright install --with-deps chromium
      - run: npm --prefix frontend ci && npm --prefix frontend run build
      - run: python tests/browser_ui_refresh.py
      - run: python tests/browser_device_pairing.py
      - run: python android/tests/ui_smoke.py
