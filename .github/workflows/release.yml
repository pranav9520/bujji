name: Release builds
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, for example v1.0.0'
        required: true
        default: v1.0.0
permissions:
  contents: read
jobs:
  windows:
    name: Windows ZIP
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: python scripts/check_release.py
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      - run: ./scripts/setup.ps1
        shell: pwsh
      - run: ./scripts/desktop-build.ps1
        shell: pwsh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-release
          path: desktop/release/*.zip
          if-no-files-found: error
  android:
    name: Signed Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - run: python scripts/check_release.py
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      - name: Prepare signing key without logging it
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Configure the Android release signing secrets first. See docs/MAINTAINERS.md.'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"
      - name: Install Android SDK packages
        run: |
          SDK_MANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDK_MANAGER" || { echo 'Android command-line tools missing from runner SDK.'; exit 1; }
          "$SDK_MANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - run: ./gradlew :app:assembleRelease :app:testDebugUnitTest :app:lintDebug --console=plain
        working-directory: android
        env:
          BUJJI_ANDROID_KEYSTORE: ${{ runner.temp }}/release.jks
          BUJJI_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          BUJJI_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BUJJI_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Name the community APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Bujji-Android.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-release
          path: Bujji-Android.apk
      - name: Remove transient signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
  publish:
    name: Publish checked artifacts
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Hash and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python scripts/check_release.py
          cd release-artifacts
          sha256sum *.apk *.zip > SHA256SUMS.txt
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ./* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" ./* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "Bujji $RELEASE_TAG"
          fi
